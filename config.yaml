# Resilio Configuration File
# This file contains all event types, locations, disruption parameters, and inventory settings
# Users can modify this file to adjust disruption days, inventory weeks, and add new locations/events
# without changing the code.

# Event Type Definitions
# Each event type specifies:
#   - keywords: List of keywords to detect this event type in text
#   - disruption_days: [mean, sigma] - Normal distribution parameters for Monte Carlo simulation
#   - description: Default description for this event type
event_types:
  Tornado:
    keywords: ["tornado"]
    disruption_days: [90, 15]  # Mean: 90 days, Sigma: 15 days (3 months)
    description: "Tornado"
  
  Hurricane:
    keywords: ["hurricane", "flood", "helene"]
    disruption_days: [60, 10]  # Mean: 60 days, Sigma: 10 days (2 months)
    description: "Hurricane"
  
  Fire:
    keywords: ["fire", "explosion"]
    disruption_days: [75, 14]  # Mean: 75 days, Sigma: 14 days (2.5 months)
    description: "Fire"
  
  Strike:
    keywords: ["strike", "labor"]
    disruption_days: [45, 10]  # Mean: 45 days, Sigma: 10 days (1.5 months)
    description: "Strike"
  
  Logistics:
    keywords: ["logistics", "truck", "delivery", "shipping"]
    disruption_days: [21, 5]  # Mean: 21 days, Sigma: 5 days (3 weeks)
    description: "Logistics"
  
  FDA:
    keywords: ["fda", "regulatory"]
    disruption_days: [90, 30]  # Mean: 90 days, Sigma: 30 days (Regulatory hold is long)
    description: "FDA"
  
  Production Disruption:
    keywords: ["disruption", "production"]
    disruption_days: [45, 7]  # Mean: 45 days, Sigma: 7 days (Generic fallback)
    description: "Production Disruption"

